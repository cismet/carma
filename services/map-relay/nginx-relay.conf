# Drop into your existing TLS server block, or use as its own vhost.
# The only non-obvious parts are the long-poll timeouts and buffering — get
# those wrong and long polling silently degrades or breaks.

location /relay/ {
    proxy_pass http://127.0.0.1:8099/;

    # --- long polling needs all three of these -------------------------
    # A parked request sits idle for up to MAX_WAIT_MS (25s). The default
    # proxy_read_timeout of 60s is fine, but be explicit so nobody "tidies"
    # it down to 10s later and wonders why updates arrive late.
    proxy_read_timeout    75s;
    proxy_send_timeout    75s;
    proxy_connect_timeout 5s;

    # Without this nginx buffers the response and the client sees the reply
    # only after nginx decides it's done. Kills any push-style transport.
    proxy_buffering  off;
    proxy_cache      off;

    # HTTP/1.1 + keep-alive upstream: avoids a fresh TCP handshake per poll,
    # which is where most of the "polling is slow" folklore comes from.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS is handled by the Node app. Do NOT also add add_header
    # Access-Control-Allow-Origin here — duplicated headers make browsers
    # reject the response outright.
}

# Optional: upstream keepalive pool. Worth it if you expect many displays.
#
# upstream map_relay {
#     server 127.0.0.1:8099;
#     keepalive 32;
# }
# ...then proxy_pass http://map_relay/;


