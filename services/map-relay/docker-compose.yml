services:
  map-relay:
    # Published by CI (or by `npx nx run map-relay:container`). Use dev-latest
    # to track the dev branch instead.
    image: cismet/carma-map-relay:latest
    container_name: map-relay
    restart: unless-stopped
    # Bind to localhost only — your existing nginx does TLS and is the only
    # thing that should be able to reach this.
    ports:
      - "127.0.0.1:8099:8080"
    environment:
      # Scheme + host, no trailing slash, no path. This is the origin the
      # geoportal is served from, not the relay's own hostname. Exactly one
      # value; the server echoes it verbatim.
      ALLOW_ORIGIN: "https://cismet.github.io"
      # AUTO_CREATE stays off here. With it on, any well-formed code an
      # attacker invents becomes a live session.
      FAST_POLL_MS: "250"
      SLOW_POLL_MS: "2000"
      MAX_WAIT_MS: "25000"
      HOT_MS: "60000"
      SESSION_TTL_MS: "21600000"
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
