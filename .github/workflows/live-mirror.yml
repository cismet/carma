name: Live mirror

# Copies the source tree behind the Wuppertal live apps into the public mirror repository.
# scripts/live-mirror/sync.mjs builds and scans the tree; this workflow uploads or pushes it.
#   live         called by deployment.yml after a live deploy of a mirrored app: mirrors the
#                exact carma and submodule commits that were built, commits on main, updates
#                LIVE.json and tags <app>/v<version> (-2, -3, ... when that tag exists); a deploy of
#                every project (app allProjects, version a UTC timestamp) gets one commit and
#                one tag, and every mirrored app's LIVE.json entry points at that tag
#   dry-run      build and scan the tree, upload it with its summary as artifact, push nothing
#   test-branch  push the tree to test/<run-id> in the mirror repository
#   publish      commit the tree on main of the mirror repository
run-name: >-
  🪞 live mirror - ${{ inputs.mode }} - ${{ inputs.ref }}${{ inputs.apps && format(' - {0}', inputs.apps) || '' }}

on:
  workflow_call:
    inputs:
      app:
        description: "The app whose live deploy triggered the mirror, allProjects for a deploy of every project"
        type: string
        required: true
      version:
        description: "Its version as deployed, a UTC timestamp for allProjects"
        type: string
        required: true
      carma_sha:
        description: "The carma commit that was built"
        type: string
        required: true
      submodule_shas:
        description: "JSON object, submodule path -> commit, as checked out by the deploy"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: "dry-run: artifact only, test-branch: push to test/<run-id>, publish: commit on main"
        options:
          - dry-run
          - test-branch
          - publish
        default: dry-run
      ref:
        description: "carma ref to mirror (submodules come from the tips of their branches, as in a deployment)"
        required: true
        default: dev
      apps:
        description: "Optional comma-separated apps instead of the list in mirror.config.json"
        required: false

permissions:
  contents: read

env:
  MIRROR_REPO: digital-twin-wuppertal-live/sourcecode-mirror
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  mirror:
    runs-on: ubuntu-latest
    # Manual and deploy-triggered runs push to the same main, one at a time.
    concurrency:
      group: live-mirror
      cancel-in-progress: false
    env:
      MODE: ${{ inputs.carma_sha && 'live' || inputs.mode }}
    steps:
      - name: Checkout carma
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.carma_sha || inputs.ref }}
          submodules: false

      # Without a cage key the action skips cage, which the mirror leaves out anyway.
      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
        with:
          remote: ${{ inputs.carma_sha && 'false' || 'true' }}

      # The deploy built the submodules at their branch tips, which may have moved since.
      - name: Check out the submodule commits of the deploy
        if: env.MODE == 'live'
        env:
          SUBMODULE_SHAS: ${{ inputs.submodule_shas }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key) \(.value)"' <<< "$SUBMODULE_SHAS" | while read -r path sha; do
            # not initialised here (cage), so not mirrored either
            [ -e "$path/.git" ] || continue
            git -C "$path" fetch -q --depth 1 origin "$sha"
            git -C "$path" checkout -q --detach "$sha"
            echo "$path $sha"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same key as in deployment.yml, so a deployment's node_modules is reused.
      - name: Restore node_modules from cache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node-20-${{ hashFiles('package-lock.json') }}

      # npm ci, because sync.mjs copies package-lock.json and npm install may rewrite it.
      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        env:
          NPMRC: ${{ secrets.CISMET_DEV_REGISTRY_SECRET_4_DOT_NPMRC }}
        run: |
          printf '%s\n' "$NPMRC" >> .npmrc
          npm ci

      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build the mirror tree
        env:
          APPS: ${{ inputs.apps }}
          NX_DAEMON: "false"
          NX_NO_CLOUD: "true"
        run: |
          node scripts/live-mirror/sync.mjs --out "$RUNNER_TEMP/tree" --strict --require-secret-scan \
            --summary "$RUNNER_TEMP/summary.json" ${APPS:+--apps "$APPS"}

      - name: Write the job summary
        if: always()
        env:
          REF: ${{ inputs.ref }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
        run: |
          [ -f "$RUNNER_TEMP/summary.json" ] || exit 0
          if [ "$MODE" = live ]; then what="${APP} v${VERSION}"; else what="\`${REF}\`"; fi
          jq -r --arg mode "$MODE" --arg what "$what" '
            "### Live mirror: \($mode) of \($what)",
            "",
            (.sources | to_entries[] | "- \(.key) `\(.value)`"),
            "- \(.apps | length) apps, \(.projects) nx projects, \(.files) files, \(.links) symlinks, \((.bytes / 1048576 * 10 | floor) / 10) MiB",
            "- apps: \(.apps | join(", "))",
            (if .aliasAdded | length > 0 then "- added through tsconfig paths: \(.aliasAdded | join(", "))" else empty end),
            (if .dirty then "- warning: uncommitted changes in mirrored paths" else empty end)
          ' "$RUNNER_TEMP/summary.json" >> "$GITHUB_STEP_SUMMARY"

      # A tarball keeps the symlinks and file modes that the artifact zip would lose.
      - name: Pack the tree
        if: env.MODE == 'dry-run'
        run: tar -czf "$RUNNER_TEMP/live-mirror-tree.tar.gz" -C "$RUNNER_TEMP/tree" .

      # Also after a failed check, the summary lists what failed.
      - name: Upload tree and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-mirror-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/live-mirror-tree.tar.gz
          retention-days: 14

      - name: Push to the mirror repository
        if: env.MODE != 'dry-run'
        env:
          REF: ${{ inputs.ref }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.CISMET_CI_DEPLOY_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          summary="$RUNNER_TEMP/summary.json"
          work="$RUNNER_TEMP/mirror"
          git init -q "$work"
          cd "$work"
          git config user.name "GitHub Actions"
          git config user.email "902348742+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${MIRROR_REPO}.git"

          # --exit-code: 0 main exists, 2 no such branch, anything else is a real failure
          set +e
          git ls-remote --exit-code --heads origin main > /dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch -q --depth 1 origin main
            git checkout -q -b mirror FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            # GitHub makes the first branch pushed to an empty repository its default branch.
            # An empty first commit on main keeps main the default when the first run is a test.
            git checkout -q --orphan main
            git commit -q --allow-empty -m "Initial commit"
            git push -q origin main
            git checkout -q -b mirror
          else
            exit "$status"
          fi

          # Replace everything except what only the mirror repository has: .github and LIVE.json
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name LIVE.json -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/tree/." .

          carma=$(jq -r '.sources.carma[0:9]' "$summary")
          if [ "$MODE" = live ]; then
            base="${APP}/v${VERSION}"
            tag="$base"
            n=1
            while git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; do
              n=$((n + 1))
              tag="${base}-${n}"
            done
            if [ "$APP" = allProjects ]; then
              # Every mirrored app went live with the version in its version.json, 0.0.0 without one
              # as in deployment.yml, all of them under the one tag.
              versions=$(jq -r '.apps[]' "$summary" | while read -r app; do
                path=$(jq -r --arg app "$app" '.projects[$app].projectPath' "$GITHUB_WORKSPACE/deployment-config.json")
                version=$(jq -r '.version // "0.0.0"' ".${path#./dist}/src/version.json" 2> /dev/null || echo 0.0.0)
                jq -n --arg app "$app" --arg version "$version" '{($app): $version}'
              done | jq -s 'add')
            else
              versions=$(jq -n --arg app "$APP" --arg version "$VERSION" '{($app): $version}')
            fi
            [ -f LIVE.json ] || echo '{}' > LIVE.json
            jq --argjson versions "$versions" --arg tag "$tag" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile summary "$summary" \
              'reduce ($versions | to_entries[]) as $e (.;
                 .[$e.key] = {version: $e.value, tag: $tag, date: $date, sources: $summary[0].sources})
               | to_entries | sort_by(.key) | from_entries' LIVE.json > "$RUNNER_TEMP/LIVE.json"
            mv "$RUNNER_TEMP/LIVE.json" LIVE.json
            subject="${APP} v${VERSION} live, carma ${carma}"
          else
            subject="Mirror carma ${carma} from ${REF}"
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The tree equals main of ${MIRROR_REPO}, nothing to push"
            exit 0
          fi
          {
            echo "$subject"
            echo
            jq -r '.sources | to_entries[] | "\(.key) \(.value)"' "$summary"
            echo "Apps: $(jq -r '.apps | join(", ")' "$summary")"
            echo "Run: ${RUN_URL}"
          } > "$RUNNER_TEMP/message.txt"
          git commit -q -F "$RUNNER_TEMP/message.txt"

          case "$MODE" in
            live)
              git tag -a "$tag" -m "$subject"
              git push -q --atomic origin HEAD:refs/heads/main "refs/tags/${tag}"
              pushed="main and tag [${tag}](https://github.com/${MIRROR_REPO}/tree/${tag})"
              ;;
            publish)
              git push -q origin HEAD:refs/heads/main
              pushed="[main](https://github.com/${MIRROR_REPO}/tree/main)"
              ;;
            *)
              git push -q origin "HEAD:refs/heads/test/${GITHUB_RUN_ID}"
              pushed="[test/${GITHUB_RUN_ID}](https://github.com/${MIRROR_REPO}/tree/test/${GITHUB_RUN_ID})"
              ;;
          esac
          {
            echo
            echo "Pushed ${pushed} of ${MIRROR_REPO}"
          } >> "$GITHUB_STEP_SUMMARY"
