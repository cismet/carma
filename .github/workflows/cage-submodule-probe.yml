name: Cage Submodule Probe

# TEMPORARY. Exercises .github/actions/init-submodules on a real runner, both
# with and without the deploy key, before this branch goes near dev.
# Triggers only on this feature branch. Delete before merging (issue #750).

on:
  push:
    branches:
      - feature/00750-mount-cage-submodule-with-ci-credentials

jobs:
  with_key:
    name: With deploy key (the real path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
        with:
          cage-deploy-key: ${{ secrets.CAGE_DEPLOY_KEY }}
          remote: "true"

      - name: cage must be populated
        run: |
          test -f cage/cage-submodule/package.json \
            && echo "OK cage populated" || (echo "FAIL cage empty" && exit 1)
          test -f libraries/collaboration/carma-wuppertal-collab/wuppertal-collab-submodule/package.json \
            && echo "OK wuppertal collab populated" || (echo "FAIL collab missing" && exit 1)

  without_key:
    name: Without deploy key (simulates a fork PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
        with:
          cage-deploy-key: ""
          remote: "true"

      - name: cage must be absent, public submodules present
        run: |
          if [ -f cage/cage-submodule/package.json ]; then
            echo "FAIL cage was fetched without a key"; exit 1
          fi
          echo "OK cage skipped"
          test -f libraries/collaboration/carma-wuppertal-collab/wuppertal-collab-submodule/package.json \
            && echo "OK wuppertal collab populated" || (echo "FAIL collab missing" && exit 1)

  no_remote:
    name: With deploy key, remote disabled
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Initialise submodules
        uses: ./.github/actions/init-submodules
        with:
          cage-deploy-key: ${{ secrets.CAGE_DEPLOY_KEY }}
          remote: "false"

      - name: cage must sit at the pinned gitlink
        run: |
          test -f cage/cage-submodule/package.json \
            && echo "OK cage populated" || (echo "FAIL cage empty" && exit 1)
          git submodule status
